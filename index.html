<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cristy Printing Shop - Manager</title>
  
  <!-- Firebase App & Realtime Database CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #ffffff;
      --card-bg: rgba(241, 245, 249, 0.95);
      --accent-green: #059669;
      --accent-blue: #2563eb;
      --text: #0f172a;
      --text-sub: #475569;
      --border: rgba(0, 0, 0, 0.12);
      --input-bg: #ffffff;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: var(--bg);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      color: var(--text);
      margin: 0;
      padding: 15px;
      min-height: 100vh;
      transition: background 0.3s ease;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .shop-title-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .shop-logo {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-blue);
      display: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .shop-name {
      font-size: 20px;
      font-weight: bold;
      text-transform: uppercase;
      margin: 0;
      letter-spacing: 0.5px;
    }

    .settings-btn {
      background: rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 20px;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .card {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(5px);
    }

    h2 { font-size: 16px; margin-top: 0; color: var(--accent-blue); border-bottom: 1px solid var(--border); padding-bottom: 8px; }

    .form-group { margin-bottom: 12px; }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    label {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
      color: var(--text-sub);
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      box-sizing: border-box;
      font-size: 15px;
      outline: none;
    }

    .btn-save {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .btn-add { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); }

    .btn-del {
      background: #ef4444;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .btn-sec {
      background: #475569;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      margin-top: 6px;
      width: 100%;
    }

    .price-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .total-card {
      background: var(--card-bg);
      padding: 15px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-left: 5px solid var(--accent-green);
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      backdrop-filter: blur(5px);
    }

    .total-title { color: var(--text-sub); font-size: 13px; font-weight: 600; }
    .total-amount { font-size: 22px; font-weight: bold; color: var(--accent-green); }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: rgba(0, 0, 0, 0.05); padding: 10px; font-size: 12px; color: var(--text-sub); }
    td { padding: 10px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }

    .see-more-container {
      text-align: center;
      padding: 12px;
    }

    .btn-seemore {
      background: none;
      border: none;
      color: var(--accent-blue);
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 1000;
    }

    .modal-content {
      background: #ffffff;
      color: #0f172a;
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      box-sizing: border-box;
      box-shadow: 0 -5px 25px rgba(0,0,0,0.2);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .modal-header h2 { border: none; margin: 0; padding: 0; }
    .close-btn { background: none; border: none; color: #64748b; font-size: 22px; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  
  <div class="nav-header">
    <div class="shop-title-area">
      <img id="shopLogo" class="shop-logo" alt="Shop Logo">
      <h1 class="shop-name">🖨️ Cristy Printing</h1>
    </div>
    <button class="settings-btn" onclick="openSettings()">⚙️</button>
  </div>

  <div class="card">
    <h2>📊 Mag-encode ng Benta</h2>
    <div class="form-group">
      <label for="entryDate">Petsa:</label>
      <input type="date" id="entryDate">
    </div>

    <div class="form-group">
      <label for="serviceDropdown">Pumili ng Service:</label>
      <select id="serviceDropdown" onchange="calculateSubtotal()"></select>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label for="itemQty">Dami (Qty / Times):</label>
        <input type="number" id="itemQty" value="1" min="1" oninput="calculateSubtotal()">
      </div>
      <div class="form-group">
        <label for="itemPrice">Kabuuang Presyo (₱):</label>
        <input type="number" id="itemPrice" placeholder="0.00" step="0.01">
      </div>
    </div>

    <button class="btn-save" onclick="addSaleRecord()">+ Record Benta</button>
  </div>

  <div class="total-card">
    <span class="total-title">KABUUANG BENTA</span>
    <span class="total-amount" id="totalAmount">₱0.00</span>
  </div>

  <div class="card" style="padding: 0; overflow: hidden;">
    <table>
      <thead>
        <tr>
          <th>Petsa</th>
          <th>Service</th>
          <th>Presyo</th>
        </tr>
      </thead>
      <tbody id="salesTableBody"></tbody>
    </table>
    <div id="seeMoreArea" class="see-more-container" style="display: none;">
      <button class="btn-seemore" onclick="toggleSeeMore()" id="seeMoreBtn">👇 Tingnan ang Lahat ng Transaksyon</button>
    </div>
  </div>

</div>

<!-- SETTINGS MODAL -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal-content">
    
    <div class="modal-header">
      <h2>⚙️ Settings & Customization</h2>
      <button class="close-btn" onclick="closeSettings()">✕</button>
    </div>

    <!-- SECURITY PIN SETTINGS -->
    <div class="form-group" style="background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0;">
      <label>🔒 Admin PIN Security (Para sa pag-void):</label>
      <div style="display: flex; gap: 8px;">
        <input type="password" id="adminPinInput" placeholder="Ilagay ang 4-digit PIN" maxlength="6" style="letter-spacing: 2px;">
        <button class="btn-sec" style="margin: 0; width: auto; background: #059669;" onclick="saveAdminPin()">I-save ang PIN</button>
      </div>
    </div>

    <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 15px 0;">

    <!-- VOID TRANSACTION MANAGEMENT (Nasa loob na ng Settings) -->
    <div class="form-group">
      <label>🗑️ Pamamahala ng Void / Bura ng Benta:</label>
      <p style="font-size: 11px; color: #64748b; margin-top: -2px; margin-bottom: 8px;">Pumili ng transaksyon na tatanggalin. Hihingi ito ng Admin PIN.</p>
      <select id="voidSelectDropdown" style="margin-bottom: 8px;"></select>
      <button class="btn-del" style="width: 100%; padding: 10px; font-size: 14px;" onclick="promptAndVoidSale()">⚠️ I-void / Burahin ang Napiling Benta</button>
    </div>

    <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 15px 0;">

    <!-- THEME COLOR & WALLPAPER PICKER -->
    <div class="form-group">
      <label>🖼️ Custom Wallpaper Image (Synced):</label>
      <input type="file" id="bgUploader" accept="image/*" onchange="handleWallpaperUpload(this)">
      <button class="btn-sec" style="background: #ef4444; margin-top: 6px;" onclick="removeBackground()">Tanggalin ang Wallpaper</button>
    </div>

    <div class="form-group" style="margin-top: 15px;">
      <label>🎨 Kulay ng Layout (Solid Color):</label>
      <div style="display: flex; gap: 10px; align-items: center;">
        <input type="color" id="themeColorPicker" value="#ffffff" onchange="changeThemeColor(this.value)" style="height: 42px; padding: 2px; cursor: pointer;">
        <button class="btn-sec" style="margin: 0; width: auto;" onclick="resetThemeColor()">I-balik sa White</button>
      </div>
    </div>

    <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 15px 0;">

    <!-- SHOP LOGO UPLOADER -->
    <div class="form-group">
      <label>👤 Palitan ang Logo ng Shop (Synced):</label>
      <input type="file" id="logoUploader" accept="image/*" onchange="handleLogoUpload(this)">
      <button class="btn-sec" style="background: #ef4444; margin-top: 6px;" onclick="removeLogo()">Tanggalin ang Logo</button>
    </div>

    <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 15px 0;">

    <!-- FIREBASE DB LINK -->
    <div class="form-group">
      <label>🔗 Firebase Centralized Database URL:</label>
      <input type="text" id="firebaseUrlInput" placeholder="https://your-app.firebaseio.com/">
      <button class="btn-sec" onclick="saveFirebaseUrl()">I-save ang Sync Link</button>
    </div>

    <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 15px 0;">

    <!-- PRICE LIST SETTINGS -->
    <div class="form-group">
      <label>⚙️ Pamamahala ng Presyo (Price List):</label>
      <input type="text" id="newServiceName" placeholder="Pangalan ng Service" style="margin-bottom: 8px;">
      <input type="number" id="newServicePrice" placeholder="Presyo bawat isa (₱)" step="0.01" style="margin-bottom: 8px;">
      <button class="btn-save btn-add" onclick="savePriceItem()">+ Dagdag sa Price List</button>
      <button class="btn-sec" style="background: #d97706; margin-top: 10px;" onclick="resetToDefaultPrices()">↺ Reset All Prices to Default</button>
    </div>

    <h3 style="font-size: 13px; color: #475569; margin-top: 15px;">Listahan ng mga Presyo:</h3>
    <div id="priceListContainer"></div>

  </div>
</div>

<script>
  document.getElementById('entryDate').valueAsDate = new Date();
  let showAllTransactions = false;
  let allSalesData = [];

  const defaultPrices = [
    { id: 1, name: '📄 Xerox - Text Only Black (Short/A4)', price: 3.00 },
    { id: 2, name: '📄 Xerox - Text Only Black (Long)', price: 4.00 },
    { id: 3, name: '📄 Xerox - Text Only Colored (Short/A4)', price: 5.00 },
    { id: 4, name: '📄 Xerox - Text Only Colored (Long)', price: 6.00 },
    { id: 5, name: '🖼️ Xerox - Image B&W Half Page (Short/A4)', price: 5.00 },
    { id: 6, name: '🖼️ Xerox - Image B&W Half Page (Long)', price: 6.00 },
    { id: 7, name: '🖼️ Xerox - Image B&W Full Page (Short/A4)', price: 7.00 },
    { id: 8, name: '🖼️ Xerox - Image B&W Full Page (Long)', price: 8.00 },
    { id: 9, name: '🎨 Xerox - Image Colored Half Page (Short/A4)', price: 8.00 },
    { id: 10, name: '🎨 Xerox - Image Colored Half Page (Long)', price: 10.00 },
    { id: 11, name: '🎨 Xerox - Image Colored Full Page (Short/A4)', price: 10.00 },
    { id: 12, name: '🎨 Xerox - Image Colored Full Page (Long)', price: 12.00 },
    { id: 13, name: '🖨️ Print - Text Only Black (Short/A4)', price: 4.00 },
    { id: 14, name: '🖨️ Print - Text Only Black (Long)', price: 6.00 },
    { id: 15, name: '🖨️ Print - Text Only Colored (Short/A4)', price: 6.00 },
    { id: 16, name: '🖨️ Print - Text Only Colored (Long)', price: 8.00 },
    { id: 17, name: '🖨️ Print - Image B&W Half Page (Short/A4)', price: 6.00 },
    { id: 18, name: '🖨️ Print - Image B&W Half Page (Long)', price: 8.00 },
    { id: 19, name: '🖨️ Print - Image B&W Full Page (Short/A4)', price: 8.00 },
    { id: 20, name: '🖨️ Print - Image B&W Full Page (Long)', price: 10.00 },
    { id: 21, name: '🖨️ Print - Image Colored Half Page (Short/A4)', price: 10.00 },
    { id: 22, name: '🖨️ Print - Image Colored Half Page (Long)', price: 12.00 },
    { id: 23, name: '🖨️ Print - Image Colored Full Page (Short/A4)', price: 15.00 },
    { id: 24, name: '🖨️ Print - Image Colored Full Page (Long)', price: 16.00 },
    { id: 25, name: '🏷️ Sticker (Per Page)', price: 60.00 },
    { id: 26, name: '✨ Laminate - ID Size', price: 15.00 },
    { id: 27, name: '✨ Laminate - A5 Size', price: 25.00 },
    { id: 28, name: '✨ Laminate - A4 Size', price: 40.00 }
  ];

  function getFirebaseDB() {
    const dbUrl = localStorage.getItem('cristyFirebaseUrl');
    if (!dbUrl) return null;
    if (!firebase.apps.length) {
      firebase.initializeApp({ databaseURL: dbUrl });
    }
    return firebase.database();
  }

  // ADMIN PIN LOGIC
  function saveAdminPin() {
    const pin = document.getElementById('adminPinInput').value.trim();
    if (!pin) return alert("Maglagay ng bisa o PIN number!");
    localStorage.setItem('cristyAdminPin', pin);
    alert("✅ Tagumpay na na-save ang Admin PIN!");
    document.getElementById('adminPinInput').value = '';
  }

  function getAdminPin() {
    return localStorage.getItem('cristyAdminPin') || '1234'; // Default PIN: 1234
  }

  // IMAGE COMPRESSION & SYNC
  function compressAndUploadImage(file, firebasePath, callback) {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 800;
        const scaleFactor = MAX_WIDTH / img.width;
        
        if (img.width > MAX_WIDTH) {
          canvas.width = MAX_WIDTH;
          canvas.height = img.height * scaleFactor;
        } else {
          canvas.width = img.width;
          canvas.height = img.height;
        }

        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);

        const db = getFirebaseDB();
        if (db) {
          db.ref(firebasePath).set(compressedBase64, (error) => {
            if (error) {
              alert('Upload failed: ' + error.message);
            } else if (callback) {
              callback(compressedBase64);
            }
          });
        } else {
          localStorage.setItem(firebasePath === 'settings/wallpaper' ? 'cristyCustomBg' : 'cristyShopLogo', compressedBase64);
          if (callback) callback(compressedBase64);
        }
      };
    };
  }

  function handleWallpaperUpload(input) {
    const file = input.files[0];
    if (file) {
      compressAndUploadImage(file, 'settings/wallpaper', (url) => {
        document.body.style.backgroundImage = `url('${url}')`;
      });
    }
  }

  async function removeBackground() {
    document.body.style.backgroundImage = 'none';
    localStorage.removeItem('cristyCustomBg');
    document.getElementById('bgUploader').value = '';
    const db = getFirebaseDB();
    if (db) db.ref('settings/wallpaper').remove();
  }

  function changeThemeColor(color) {
    removeBackground();
    document.body.style.backgroundColor = color;
    localStorage.setItem('cristyThemeColor', color);
  }

  function resetThemeColor() {
    removeBackground();
    document.body.style.backgroundColor = '#ffffff';
    document.getElementById('themeColorPicker').value = '#ffffff';
    localStorage.removeItem('cristyThemeColor');
  }

  function handleLogoUpload(input) {
    const file = input.files[0];
    if (file) {
      compressAndUploadImage(file, 'settings/logo', (url) => {
        const logoElem = document.getElementById('shopLogo');
        logoElem.src = url;
        logoElem.style.display = 'block';
      });
    }
  }

  async function removeLogo() {
    const logoElem = document.getElementById('shopLogo');
    logoElem.style.display = 'none';
    logoElem.src = '';
    localStorage.removeItem('cristyShopLogo');
    document.getElementById('logoUploader').value = '';
    const db = getFirebaseDB();
    if (db) db.ref('settings/logo').remove();
  }

  function saveFirebaseUrl() {
    let url = document.getElementById('firebaseUrlInput').value.trim();
    if (url && !url.endsWith('/')) url += '/';
    localStorage.setItem('cristyFirebaseUrl', url);
    alert('Na-save na ang Firebase URL!');
    listenToFirebaseAll();
    loadSales();
  }

  function openSettings() {
    document.getElementById('firebaseUrlInput').value = localStorage.getItem('cristyFirebaseUrl') || '';
    document.getElementById('settingsModal').style.display = 'flex';
    populateVoidDropdown();
  }

  function closeSettings() {
    document.getElementById('settingsModal').style.display = 'none';
  }

  // PRICELIST
  function getCustomPrices() {
    const saved = localStorage.getItem('cristyCustomPrices');
    if (!saved || JSON.parse(saved).length === 0) {
      localStorage.setItem('cristyCustomPrices', JSON.stringify(defaultPrices));
      return defaultPrices;
    }
    return JSON.parse(saved);
  }

  function resetToDefaultPrices() {
    if (confirm("Gusto mo bang ibalik sa orihinal na talaan ng presyo?")) {
      localStorage.setItem('cristyCustomPrices', JSON.stringify(defaultPrices));
      loadPriceManager();
      populateDropdown();
    }
  }

  function savePriceItem() {
    const name = document.getElementById('newServiceName').value.trim();
    const price = parseFloat(document.getElementById('newServicePrice').value);
    if (!name || isNaN(price)) return alert("Kumpletuhin ang pangalan at presyo!");

    let prices = getCustomPrices();
    prices.push({ id: Date.now(), name, price });
    localStorage.setItem('cristyCustomPrices', JSON.stringify(prices));
    
    document.getElementById('newServiceName').value = '';
    document.getElementById('newServicePrice').value = '';
    loadPriceManager();
    populateDropdown();
  }

  function deletePriceItem(id) {
    let prices = getCustomPrices().filter(p => p.id !== id);
    localStorage.setItem('cristyCustomPrices', JSON.stringify(prices));
    loadPriceManager();
    populateDropdown();
  }

  function loadPriceManager() {
    const container = document.getElementById('priceListContainer');
    const prices = getCustomPrices();
    container.innerHTML = '';
    prices.forEach(p => {
      container.innerHTML += `
        <div class="price-item">
          <div><strong>${p.name}</strong> - <span style="color:var(--accent-green)">₱${p.price.toFixed(2)}</span></div>
          <button class="btn-del" onclick="deletePriceItem(${p.id})">Bura</button>
        </div>
      `;
    });
  }

  function populateDropdown() {
    const dropdown = document.getElementById('serviceDropdown');
    const prices = getCustomPrices();
    dropdown.innerHTML = '';
    prices.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.name;
      opt.setAttribute('data-price', p.price);
      opt.textContent = `${p.name} - ₱${p.price.toFixed(2)}`;
      dropdown.appendChild(opt);
    });
    calculateSubtotal();
  }

  function calculateSubtotal() {
    const dropdown = document.getElementById('serviceDropdown');
    const selected = dropdown.options[dropdown.selectedIndex];
    const qtyInput = document.getElementById('itemQty');
    let qty = parseInt(qtyInput.value);

    if (isNaN(qty) || qty < 1) qty = 1;

    if (selected) {
      const unitPrice = parseFloat(selected.getAttribute('data-price')) || 0;
      document.getElementById('itemPrice').value = (unitPrice * qty).toFixed(2);
    }
  }

  // SALES RECORD LOGIC
  async function addSaleRecord() {
    const date = document.getElementById('entryDate').value;
    const baseType = document.getElementById('serviceDropdown').value;
    const qty = parseInt(document.getElementById('itemQty').value) || 1;
    const price = parseFloat(document.getElementById('itemPrice').value);

    if (!date || isNaN(price) || price <= 0) return alert("Lagyan ng tamang halaga!");

    const type = qty > 1 ? `${baseType} (x${qty})` : baseType;
    const newSale = { date, type, price, timestamp: Date.now() };
    const db = getFirebaseDB();

    if (db) {
      db.ref('sales').push(newSale);
    } else {
      let sales = JSON.parse(localStorage.getItem('cristyPrintingSales')) || [];
      sales.push({ keyId: 'local_' + Date.now(), ...newSale });
      localStorage.setItem('cristyPrintingSales', JSON.stringify(sales));
    }

    document.getElementById('itemQty').value = 1;
    calculateSubtotal();
    loadSales();
    alert("✅ Tagumpay na naitala ang benta!");
  }

  // SECURE VOID FUNCTION VIA SETTINGS
  function promptAndVoidSale() {
    const dropdown = document.getElementById('voidSelectDropdown');
    const selectedKey = dropdown.value;

    if (!selectedKey) return alert("Walang napiling transaksyon na ili-void!");

    const enteredPin = prompt("🔒 Ilagay ang Admin PIN para mai-void ang transaksyong ito:");
    if (enteredPin === null) return; // I-cancel

    if (enteredPin === getAdminPin()) {
      if (confirm("Sigurado ka bang gusto mong i-void/burahin ang transaksyong ito?")) {
        executeVoid(selectedKey);
      }
    } else {
      alert("❌ Maling PIN! Hindi pwedeng i-void ang transaksyon.");
    }
  }

  async function executeVoid(keyId) {
    const db = getFirebaseDB();
    if (db && !keyId.startsWith('local_')) {
      await db.ref('sales/' + keyId).remove();
    } else {
      let sales = JSON.parse(localStorage.getItem('cristyPrintingSales')) || [];
      sales = sales.filter(item => item.keyId !== keyId);
      localStorage.setItem('cristyPrintingSales', JSON.stringify(sales));
    }
    alert("🗑️ Tagumpay na na-void ang transaksyon.");
    loadSales();
    populateVoidDropdown();
  }

  function populateVoidDropdown() {
    const dropdown = document.getElementById('voidSelectDropdown');
    dropdown.innerHTML = '';

    if (allSalesData.length === 0) {
      dropdown.innerHTML = `<option value="">Walang transaksyon na magagamit</option>`;
      return;
    }

    allSalesData.forEach(item => {
      const opt = document.createElement('option');
      opt.value = item.keyId;
      opt.textContent = `[${item.date}] ${item.type} - ₱${item.price.toFixed(2)}`;
      dropdown.appendChild(opt);
    });
  }

  function toggleSeeMore() {
    showAllTransactions = !showAllTransactions;
    const btn = document.getElementById('seeMoreBtn');
    btn.textContent = showAllTransactions ? "👆 Itago ang Iba Pa" : "👇 Tingnan ang Lahat ng Transaksyon";
    renderSalesTable();
  }

  function loadSales() {
    const db = getFirebaseDB();
    if (db) {
      db.ref('sales').on('value', (snapshot) => {
        const data = snapshot.val();
        allSalesData = [];
        if (data) {
          Object.keys(data).forEach(key => {
            allSalesData.push({ keyId: key, ...data[key] });
          });
        }
        processSalesData();
      });
    } else {
      allSalesData = JSON.parse(localStorage.getItem('cristyPrintingSales')) || [];
      processSalesData();
    }
  }

  function processSalesData() {
    allSalesData.sort((a, b) => b.timestamp - a.timestamp);
    let total = 0;
    allSalesData.forEach(item => total += item.price);
    document.getElementById('totalAmount').innerText = `₱${total.toFixed(2)}`;
    renderSalesTable();
    if (document.getElementById('settingsModal').style.display === 'flex') {
      populateVoidDropdown();
    }
  }

  function renderSalesTable() {
    const tbody = document.getElementById('salesTableBody');
    const seeMoreArea = document.getElementById('seeMoreArea');
    tbody.innerHTML = '';

    if (allSalesData.length === 0) {
      tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #64748b; padding: 15px;">Wala pang naitatalang benta.</td></tr>`;
      seeMoreArea.style.display = 'none';
      return;
    }

    const displayList = showAllTransactions ? allSalesData : allSalesData.slice(0, 7);

    displayList.forEach(item => {
      tbody.innerHTML += `
        <tr>
          <td>${item.date}</td>
          <td>${item.type}</td>
          <td style="font-weight: bold; color: var(--accent-green);">₱${item.price.toFixed(2)}</td>
        </tr>
      `;
    });

    if (allSalesData.length > 7) {
      seeMoreArea.style.display = 'block';
    } else {
      seeMoreArea.style.display = 'none';
    }
  }

  function listenToFirebaseAll() {
    const db = getFirebaseDB();
    if (!db) return;

    db.ref('settings/wallpaper').on('value', (snapshot) => {
      const bg = snapshot.val();
      if (bg) document.body.style.backgroundImage = `url('${bg}')`;
    });

    db.ref('settings/logo').on('value', (snapshot) => {
      const logo = snapshot.val();
      const logoElem = document.getElementById('shopLogo');
      if (logo && logoElem) {
        logoElem.src = logo;
        logoElem.style.display = 'block';
      }
    });
  }

  // INITIAL LOAD
  window.onload = function() {
    const savedBg = localStorage.getItem('cristyCustomBg');
    if (savedBg) document.body.style.backgroundImage = `url('${savedBg}')`;

    const savedLogo = localStorage.getItem('cristyShopLogo');
    if (savedLogo) {
      const logoElem = document.getElementById('shopLogo');
      logoElem.src = savedLogo;
      logoElem.style.display = 'block';
    }

    loadPriceManager();
    populateDropdown();
    loadSales();
    listenToFirebaseAll();
  };
</script>

</body>
</html>
