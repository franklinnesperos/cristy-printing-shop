<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cristy Printing Shop - Manager</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.90);
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
      --text: #f8fafc;
      --text-sub: #cbd5e1;
      --border: rgba(255, 255, 255, 0.15);
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: var(--bg);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      color: var(--text);
      margin: 0;
      padding: 15px;
      min-height: 100vh;
      transition: background 0.3s ease-in-out;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    /* Top Navbar na may Gear Icon */
    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .shop-title-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .shop-logo {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ffffff;
      display: none;
    }

    .shop-name {
      font-size: 18px;
      font-weight: bold;
      text-transform: uppercase;
      margin: 0;
    }

    .settings-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 20px;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }

    /* Card Styling */
    .card {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 15px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    h2 { font-size: 16px; margin-top: 0; color: #60a5fa; border-bottom: 1px solid var(--border); padding-bottom: 8px; }

    .form-group { margin-bottom: 12px; }

    label {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
      color: var(--text-sub);
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.8);
      color: var(--text);
      box-sizing: border-box;
      font-size: 15px;
      outline: none;
    }

    .btn-save {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .btn-add { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); }

    .btn-del {
      background: #ef4444;
      color: white;
      border: none;
      padding: 5px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .btn-sec {
      background: #475569;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      margin-top: 6px;
      width: 100%;
    }

    .price-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .total-card {
      background: var(--card-bg);
      padding: 15px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-left: 5px solid var(--accent-green);
      backdrop-filter: blur(8px);
    }

    .total-title { color: var(--text-sub); font-size: 13px; font-weight: 600; }
    .total-amount { font-size: 22px; font-weight: bold; color: var(--accent-green); }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: rgba(51, 65, 85, 0.9); padding: 10px; font-size: 12px; color: var(--text-sub); }
    td { padding: 10px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }

    /* Modal / Slide Panel para sa Settings */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 1000;
    }

    .modal-content {
      background: #1e293b;
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      box-sizing: border-box;
      border-top: 1px solid var(--border);
      box-shadow: 0 -5px 25px rgba(0,0,0,0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .modal-header h2 { border: none; margin: 0; padding: 0; }
    .close-btn { background: none; border: none; color: var(--text-sub); font-size: 22px; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  
  <!-- Top Navigation Header -->
  <div class="nav-header">
    <div class="shop-title-area">
      <img id="displayLogo" class="shop-logo" alt="Profile Logo">
      <h1 class="shop-name">🖨️ Cristy Shop</h1>
    </div>
    <button class="settings-btn" onclick="openSettings()">⚙️</button>
  </div>

  <!-- SEKSYON 1: Encoding ng Benta -->
  <div class="card">
    <h2>📊 Mag-encode ng Benta</h2>
    <div class="form-group">
      <label for="entryDate">Petsa:</label>
      <input type="date" id="entryDate">
    </div>

    <div class="form-group">
      <label for="serviceDropdown">Pumili ng Service:</label>
      <select id="serviceDropdown" onchange="autoFillPrice()"></select>
    </div>

    <div class="form-group">
      <label for="itemPrice">Halaga ng Benta (₱):</label>
      <input type="number" id="itemPrice" placeholder="0.00" step="0.01">
    </div>

    <button class="btn-save" onclick="addSaleRecord()">+ Record Benta</button>
  </div>

  <!-- Total Benta Display -->
  <div class="total-card">
    <span class="total-title">KABUUMANG BENTA</span>
    <span class="total-amount" id="totalAmount">₱0.00</span>
  </div>

  <!-- Sales Log Table -->
  <div class="card" style="padding: 0; overflow: hidden;">
    <table>
      <thead>
        <tr>
          <th>Petsa</th>
          <th>Service</th>
          <th>Presyo</th>
          <th style="text-align: center;">Aksyon</th>
        </tr>
      </thead>
      <tbody id="salesTableBody"></tbody>
    </table>
  </div>

</div>

<!-- SETTINGS MODAL PANEL -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal-content">
    
    <div class="modal-header">
      <h2>⚙️ Settings & Configuration</h2>
      <button class="close-btn" onclick="closeSettings()">✕</button>
    </div>

    <!-- PROFILE / LOGO SECTION -->
    <div class="form-group" style="margin-bottom: 20px;">
      <label>👤 Profile / Shop Logo:</label>
      <input type="file" id="logoUploader" accept="image/*" onchange="changeLogo(event)">
      <button class="btn-sec" onclick="removeLogo()">Tanggalin ang Logo</button>
    </div>

    <hr style="border: 0; border-top: 1px solid var(--border); margin: 15px 0;">

    <!-- BACKGROUND SECTION -->
    <div class="form-group" style="margin-bottom: 20px;">
      <label>🖼️ Custom Background Picture:</label>
      <input type="file" id="bgUploader" accept="image/*" onchange="changeBackground(event)">
      
      <div style="display: flex; gap: 8px; margin-top: 8px;">
        <button class="btn-sec" style="background: #000000; border: 1px solid #333;" onclick="setBlackBg()">⬛ Solid Black</button>
        <button class="btn-sec" onclick="removeBackground()">Default Dark Blue</button>
      </div>
    </div>

    <hr style="border: 0; border-top: 1px solid var(--border); margin: 15px 0;">

    <!-- PRICE MANAGER SECTION -->
    <div class="form-group">
      <label>⚙️ Pamamahala ng Presyo (Price List):</label>
      <input type="text" id="newServiceName" placeholder="Pangalan ng Service / Item" style="margin-bottom: 8px;">
      <input type="number" id="newServicePrice" placeholder="Presyo (₱)" step="0.01" style="margin-bottom: 8px;">
      <button class="btn-save btn-add" onclick="savePriceItem()">+ Dagdag sa Price List</button>
    </div>

    <h3 style="font-size: 13px; color: var(--text-sub); margin-top: 15px;">Listahan ng mga Presyo:</h3>
    <div id="priceListContainer"></div>

  </div>
</div>

<script>
  document.getElementById('entryDate').valueAsDate = new Date();

  // ----- SETTINGS MODAL CONTROL -----
  function openSettings() {
    document.getElementById('settingsModal').style.display = 'flex';
  }

  function closeSettings() {
    document.getElementById('settingsModal').style.display = 'none';
  }

  // ----- PROFILE / LOGO LOGIC -----
  function changeLogo(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const logoData = e.target.result;
        const img = document.getElementById('displayLogo');
        img.src = logoData;
        img.style.display = 'block';
        try {
          localStorage.setItem('cristyShopLogo', logoData);
        } catch(err) {
          alert("Masyadong malaki ang picture ng Logo. Pumatag ng mas maliit na larawan.");
        }
      };
      reader.readAsDataURL(file);
    }
  }

  function removeLogo() {
    const img = document.getElementById('displayLogo');
    img.src = '';
    img.style.display = 'none';
    localStorage.removeItem('cristyShopLogo');
  }

  function loadSavedLogo() {
    const savedLogo = localStorage.getItem('cristyShopLogo');
    if (savedLogo) {
      const img = document.getElementById('displayLogo');
      img.src = savedLogo;
      img.style.display = 'block';
    }
  }

  // ----- BACKGROUND LOGIC -----
  function changeBackground(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const imageData = e.target.result;
        document.body.style.backgroundImage = `url('${imageData}')`;
        document.body.style.backgroundColor = 'transparent';
        try {
          localStorage.setItem('cristyCustomBg', imageData);
          localStorage.setItem('cristyBgType', 'image');
        } catch(err) {
          alert("Masyadong malaki ang larawan. Pumili ng mas maliit na photo.");
        }
      };
      reader.readAsDataURL(file);
    }
  }

  function setBlackBg() {
    document.body.style.backgroundImage = 'none';
    document.body.style.backgroundColor = '#000000';
    localStorage.setItem('cristyBgType', 'black');
    localStorage.removeItem('cristyCustomBg');
  }

  function removeBackground() {
    document.body.style.backgroundImage = 'none';
    document.body.style.backgroundColor = '#0f172a';
    localStorage.removeItem('cristyBgType');
    localStorage.removeItem('cristyCustomBg');
  }

  function loadSavedBackground() {
    const bgType = localStorage.getItem('cristyBgType');
    if (bgType === 'black') {
      document.body.style.backgroundImage = 'none';
      document.body.style.backgroundColor = '#000000';
    } else if (bgType === 'image') {
      const savedBg = localStorage.getItem('cristyCustomBg');
      if (savedBg) {
        document.body.style.backgroundImage = `url('${savedBg}')`;
      }
    }
  }

  // ----- PRICE LIST LOGIC -----
  function getCustomPrices() {
    return JSON.parse(localStorage.getItem('cristyCustomPrices')) || [
      { id: 1, name: '📄 Xerox (Standard)', price: 2.00 },
      { id: 2, name: '🖨️ Print (Document)', price: 5.00 },
      { id: 3, name: '✨ Laminate (A4/Short)', price: 40.00 }
    ];
  }

  function savePriceItem() {
    const name = document.getElementById('newServiceName').value.trim();
    const price = parseFloat(document.getElementById('newServicePrice').value);

    if (!name || isNaN(price) || price < 0) {
      alert("Paki-lagay ang tamang Pangalan at Presyo!");
      return;
    }

    let prices = getCustomPrices();
    prices.push({ id: Date.now(), name, price });
    localStorage.setItem('cristyCustomPrices', JSON.stringify(prices));

    document.getElementById('newServiceName').value = '';
    document.getElementById('newServicePrice').value = '';
    
    loadPriceManager();
    populateDropdown();
  }

  function deletePriceItem(id) {
    let prices = getCustomPrices();
    prices = prices.filter(p => p.id !== id);
    localStorage.setItem('cristyCustomPrices', JSON.stringify(prices));
    loadPriceManager();
    populateDropdown();
  }

  function loadPriceManager() {
    const container = document.getElementById('priceListContainer');
    const prices = getCustomPrices();
    container.innerHTML = '';

    prices.forEach(p => {
      container.innerHTML += `
        <div class="price-item">
          <div><strong>${p.name}</strong> - <span style="color:var(--accent-green)">₱${p.price.toFixed(2)}</span></div>
          <button class="btn-del" onclick="deletePriceItem(${p.id})">Bura</button>
        </div>
      `;
    });
  }

  function populateDropdown() {
    const dropdown = document.getElementById('serviceDropdown');
    const prices = getCustomPrices();
    dropdown.innerHTML = '';

    prices.forEach((p) => {
      dropdown.innerHTML += `<option value="${p.name}" data-price="${p.price}">${p.name}</option>`;
    });

    autoFillPrice();
  }

  function autoFillPrice() {
    const dropdown = document.getElementById('serviceDropdown');
    const selectedOption = dropdown.options[dropdown.selectedIndex];
    if (selectedOption) {
      document.getElementById('itemPrice').value = selectedOption.getAttribute('data-price');
    }
  }

  // ----- SALES LOG LOGIC -----
  function getSales() {
    return JSON.parse(localStorage.getItem('cristyPrintingSales')) || [];
  }

  function addSaleRecord() {
    const date = document.getElementById('entryDate').value;
    const type = document.getElementById('serviceDropdown').value;
    const price = parseFloat(document.getElementById('itemPrice').value);

    if (!date || isNaN(price) || price <= 0) {
      alert("Paki-lagay ang tamang halaga!");
      return;
    }

    const sales = getSales();
    sales.push({ id: Date.now(), date, type, price });
    localStorage.setItem('cristyPrintingSales', JSON.stringify(sales));

    loadSales();
  }

  function deleteSaleRecord(id) {
    if (confirm("Sigurado ka bang gusto mong i-void ang benta na ito?")) {
      let sales = getSales();
      sales = sales.filter(item => item.id !== id);
      localStorage.setItem('cristyPrintingSales', JSON.stringify(sales));
      loadSales();
    }
  }

  function loadSales() {
    const sales = getSales();
    const tbody = document.getElementById('salesTableBody');
    tbody.innerHTML = '';
    let total = 0;

    if (sales.length === 0) {
      tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #cbd5e1; padding: 15px;">Wala pang naitatalang benta.</td></tr>`;
      document.getElementById('totalAmount').innerText = '₱0.00';
      return;
    }

    sales.forEach(item => {
      total += item.price;
      tbody.innerHTML += `
        <tr>
          <td>${item.date}</td>
          <td>${item.type}</td>
          <td style="font-weight: bold; color: var(--accent-green);">₱${item.price.toFixed(2)}</td>
          <td style="text-align: center;">
            <button class="btn-del" onclick="deleteSaleRecord(${item.id})">Void</button>
          </td>
        </tr>
      `;
    });

    document.getElementById('totalAmount').innerText = `₱${total.toFixed(2)}`;
  }

  // INITIAL LOAD
  document.addEventListener('DOMContentLoaded', () => {
    loadSavedLogo();
    loadSavedBackground();
    loadPriceManager();
    populateDropdown();
    loadSales();
  });
</script>

</body>
</html>
