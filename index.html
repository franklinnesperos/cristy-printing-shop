<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cristy Printing Shop - Manager</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.90);
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
      --text: #f8fafc;
      --text-sub: #cbd5e1;
      --border: rgba(255, 255, 255, 0.15);
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: var(--bg);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      color: var(--text);
      margin: 0;
      padding: 15px;
      min-height: 100vh;
      transition: background 0.3s ease-in-out;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .shop-title-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .shop-logo {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ffffff;
      display: none;
    }

    .shop-name {
      font-size: 18px;
      font-weight: bold;
      text-transform: uppercase;
      margin: 0;
    }

    .settings-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 20px;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }

    .card {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 15px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    h2 { font-size: 16px; margin-top: 0; color: #60a5fa; border-bottom: 1px solid var(--border); padding-bottom: 8px; }

    .form-group { margin-bottom: 12px; }

    label {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
      color: var(--text-sub);
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.8);
      color: var(--text);
      box-sizing: border-box;
      font-size: 15px;
      outline: none;
    }

    .btn-save {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .btn-add { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); }

    .btn-del {
      background: #ef4444;
      color: white;
      border: none;
      padding: 5px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .btn-sec {
      background: #475569;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      margin-top: 6px;
      width: 100%;
    }

    .price-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .total-card {
      background: var(--card-bg);
      padding: 15px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-left: 5px solid var(--accent-green);
      backdrop-filter: blur(8px);
    }

    .total-title { color: var(--text-sub); font-size: 13px; font-weight: 600; }
    .total-amount { font-size: 22px; font-weight: bold; color: var(--accent-green); }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: rgba(51, 65, 85, 0.9); padding: 10px; font-size: 12px; color: var(--text-sub); }
    td { padding: 10px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 1000;
    }

    .modal-content {
      background: #1e293b;
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      box-sizing: border-box;
      border-top: 1px solid var(--border);
      box-shadow: 0 -5px 25px rgba(0,0,0,0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .modal-header h2 { border: none; margin: 0; padding: 0; }
    .close-btn { background: none; border: none; color: var(--text-sub); font-size: 22px; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  
  <div class="nav-header">
    <div class="shop-title-area">
      <img id="displayLogo" class="shop-logo" alt="Profile Logo">
      <h1 class="shop-name">🖨️ Cristy Printing</h1>
    </div>
    <button class="settings-btn" onclick="openSettings()">⚙️</button>
  </div>

  <div class="card">
    <h2>📊 Mag-encode ng Benta</h2>
    <div class="form-group">
      <label for="entryDate">Petsa:</label>
      <input type="date" id="entryDate">
    </div>

    <div class="form-group">
      <label for="serviceDropdown">Pumili ng Service:</label>
      <select id="serviceDropdown" onchange="autoFillPrice()"></select>
    </div>

    <div class="form-group">
      <label for="itemPrice">Halaga ng Benta (₱):</label>
      <input type="number" id="itemPrice" placeholder="0.00" step="0.01">
    </div>

    <button class="btn-save" onclick="addSaleRecord()">+ Record Benta</button>
  </div>

  <div class="total-card">
    <span class="total-title">KABUUMANG BENTA</span>
    <span class="total-amount" id="totalAmount">₱0.00</span>
  </div>

  <div class="card" style="padding: 0; overflow: hidden;">
    <table>
      <thead>
        <tr>
          <th>Petsa</th>
          <th>Service</th>
          <th>Presyo</th>
          <th style="text-align: center;">Aksyon</th>
        </tr>
      </thead>
      <tbody id="salesTableBody"></tbody>
    </table>
  </div>

</div>

<!-- SETTINGS MODAL PANEL -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal-content">
    
    <div class="modal-header">
      <h2>⚙️ Settings & Centralized Sync</h2>
      <button class="close-btn" onclick="closeSettings()">✕</button>
    </div>

    <!-- FIREBASE DB LINK -->
    <div class="form-group">
      <label>🔗 Firebase Centralized Database URL:</label>
      <input type="text" id="firebaseUrlInput" placeholder="https://your-app.firebaseio.com/">
      <button class="btn-sec" onclick="saveFirebaseUrl()">I-save ang Sync Link</button>
      <small style="color: #94a3b8; font-size: 11px;">I-paste ang Firebase Realtime Database URL mo para mag-sync sa lahat ng device.</small>
    </div>

    <hr style="border: 0; border-top: 1px solid var(--border); margin: 15px 0;">

    <div class="form-group">
      <label>👤 Profile / Shop Logo:</label>
      <input type="file" id="logoUploader" accept="image/*" onchange="changeLogo(event)">
      <button class="btn-sec" onclick="removeLogo()">Tanggalin ang Logo</button>
    </div>

    <hr style="border: 0; border-top: 1px solid var(--border); margin: 15px 0;">

    <div class="form-group">
      <label>🖼️ Custom Background Picture:</label>
      <input type="file" id="bgUploader" accept="image/*" onchange="changeBackground(event)">
      <div style="display: flex; gap: 8px; margin-top: 8px;">
        <button class="btn-sec" style="background: #000000; border: 1px solid #333;" onclick="setBlackBg()">⬛ Solid Black</button>
        <button class="btn-sec" onclick="removeBackground()">Default Dark Blue</button>
      </div>
    </div>

    <hr style="border: 0; border-top: 1px solid var(--border); margin: 15px 0;">

    <div class="form-group">
      <label>⚙️ Pamamahala ng Presyo (Price List):</label>
      <input type="text" id="newServiceName" placeholder="Pangalan ng Service" style="margin-bottom: 8px;">
      <input type="number" id="newServicePrice" placeholder="Presyo (₱)" step="0.01" style="margin-bottom: 8px;">
      <button class="btn-save btn-add" onclick="savePriceItem()">+ Dagdag sa Price List</button>
    </div>

    <h3 style="font-size: 13px; color: var(--text-sub); margin-top: 15px;">Listahan ng mga Presyo:</h3>
    <div id="priceListContainer"></div>

  </div>
</div>

<script>
  document.getElementById('entryDate').valueAsDate = new Date();

  // KUMPLETONG LISTAHAN NG LAHAT NG MGA PRESLIST MULA SA IN-UPLOAD MONG LARAWAN
  const defaultPrices = [
    // XEROX SECTION
    { id: 1, name: '📄 Xerox - Text Only Black (Short/A4)', price: 3.00 },
    { id: 2, name: '📄 Xerox - Text Only Black (Long)', price: 4.00 },
    { id: 3, name: '📄 Xerox - Text Only Colored (Short/A4)', price: 5.00 },
    { id: 4, name: '📄 Xerox - Text Only Colored (Long)', price: 6.00 },
    { id: 5, name: '🖼️ Xerox - Image B&W Half Page (Short/A4)', price: 5.00 },
    { id: 6, name: '🖼️ Xerox - Image B&W Half Page (Long)', price: 6.00 },
    { id: 7, name: '🖼️ Xerox - Image B&W Full Page (Short/A4)', price: 7.00 },
    { id: 8, name: '🖼️ Xerox - Image B&W Full Page (Long)', price: 8.00 },
    { id: 9, name: '🎨 Xerox - Image Colored Half Page (Short/A4)', price: 8.00 },
    { id: 10, name: '🎨 Xerox - Image Colored Half Page (Long)', price: 10.00 },
    { id: 11, name: '🎨 Xerox - Image Colored Full Page (Short/A4)', price: 10.00 },
    { id: 12, name: '🎨 Xerox - Image Colored Full Page (Long)', price: 12.00 },

    // PRINT SECTION
    { id: 13, name: '🖨️ Print - Text Only Black (Short/A4)', price: 4.00 },
    { id: 14, name: '🖨️ Print - Text Only Black (Long)', price: 6.00 },
    { id: 15, name: '🖨️ Print - Text Only Colored (Short/A4)', price: 6.00 },
    { id: 16, name: '🖨️ Print - Text Only Colored (Long)', price: 8.00 },
    { id: 17, name: '🖨️ Print - Image B&W Half Page (Short/A4)', price: 6.00 },
    { id: 18, name: '🖨️ Print - Image B&W Half Page (Long)', price: 8.00 },
    { id: 19, name: '🖨️ Print - Image B&W Full Page (Short/A4)', price: 8.00 },
    { id: 20, name: '🖨️ Print - Image B&W Full Page (Long)', price: 10.00 },
    { id: 21, name: '🖨️ Print - Image Colored Half Page (Short/A4)', price: 10.00 },
    { id: 22, name: '🖨️ Print - Image Colored Half Page (Long)', price: 12.00 },
    { id: 23, name: '🖨️ Print - Image Colored Full Page (Short/A4)', price: 15.00 },
    { id: 24, name: '🖨️ Print - Image Colored Full Page (Long)', price: 16.00 },

    // STICKER SECTION
    { id: 25, name: '🏷️ Sticker (Per Page)', price: 60.00 },

    // LAMINATE SECTION
    { id: 26, name: '✨ Laminate - ID Size', price: 15.00 },
    { id: 27, name: '✨ Laminate - A5 Size', price: 25.00 },
    { id: 28, name: '✨ Laminate - A4 Size', price: 40.00 }
  ];

  function getDbUrl() {
    return localStorage.getItem('cristyFirebaseUrl') || '';
  }

  function saveFirebaseUrl() {
    let url = document.getElementById('firebaseUrlInput').value.trim();
    if (url && !url.endsWith('/')) url += '/';
    localStorage.setItem('cristyFirebaseUrl', url);
    alert('Na-save na ang Firebase URL! Mag-i-sync na ito sa lahat ng device.');
    loadSales();
  }

  function openSettings() {
    document.getElementById('firebaseUrlInput').value = getDbUrl();
    document.getElementById('settingsModal').style.display = 'flex';
  }

  function closeSettings() {
    document.getElementById('settingsModal').style.display = 'none';
  }

  // LOGO & BG LOGIC
  function changeLogo(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        const logoData = evt.target.result;
        document.getElementById('displayLogo').src = logoData;
        document.getElementById('displayLogo').style.display = 'block';
        localStorage.setItem('cristyShopLogo', logoData);
      };
      reader.readAsDataURL(file);
    }
  }

  function removeLogo() {
    document.getElementById('displayLogo').style.display = 'none';
    localStorage.removeItem('cristyShopLogo');
  }

  function loadSavedLogo() {
    const savedLogo = localStorage.getItem('cristyShopLogo');
    if (savedLogo) {
      document.getElementById('displayLogo').src = savedLogo;
      document.getElementById('displayLogo').style.display = 'block';
    }
  }

  function changeBackground(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        document.body.style.backgroundImage = `url('${evt.target.result}')`;
        localStorage.setItem('cristyCustomBg', evt.target.result);
        localStorage.setItem('cristyBgType', 'image');
      };
      reader.readAsDataURL(file);
    }
  }

  function setBlackBg() {
    document.body.style.backgroundImage = 'none';
    document.body.style.backgroundColor = '#000000';
    localStorage.setItem('cristyBgType', 'black');
  }

  function removeBackground() {
    document.body.style.backgroundImage = 'none';
    document.body.style.backgroundColor = '#0f172a';
    localStorage.removeItem('cristyBgType');
  }

  function loadSavedBackground() {
    const bgType = localStorage.getItem('cristyBgType');
    if (bgType === 'black') {
      document.body.style.backgroundColor = '#000000';
    } else if (bgType === 'image') {
      const savedBg = localStorage.getItem('cristyCustomBg');
      if (savedBg) document.body.style.backgroundImage = `url('${savedBg}')`;
    }
  }

  // PRICE MANAGEMENT
  function getCustomPrices() {
    return JSON.parse(localStorage.getItem('cristyCustomPrices')) || defaultPrices;
  }

  function savePriceItem() {
    const name = document.getElementById('newServiceName').value.trim();
    const price = parseFloat(document.getElementById('newServicePrice').value);
    if (!name || isNaN(price)) return alert("Kumpletuhin ang pangalan at presyo!");

    let prices = getCustomPrices();
    prices.push({ id: Date.now(), name, price });
    localStorage.setItem('cristyCustomPrices', JSON.stringify(prices));
    
    document.getElementById('newServiceName').value = '';
    document.getElementById('newServicePrice').value = '';
    loadPriceManager();
    populateDropdown();
  }

  function deletePriceItem(id) {
    let prices = getCustomPrices().filter(p => p.id !== id);
    localStorage.setItem('cristyCustomPrices', JSON.stringify(prices));
    loadPriceManager();
    populateDropdown();
  }

  function loadPriceManager() {
    const container = document.getElementById('priceListContainer');
    const prices = getCustomPrices();
    container.innerHTML = '';
    prices.forEach(p => {
      container.innerHTML += `
        <div class="price-item">
          <div><strong>${p.name}</strong> - <span style="color:var(--accent-green)">₱${p.price.toFixed(2)}</span></div>
          <button class="btn-del" onclick="deletePriceItem(${p.id})">Bura</button>
        </div>
      `;
    });
  }

  function populateDropdown() {
    const dropdown = document.getElementById('serviceDropdown');
    const prices = getCustomPrices();
    dropdown.innerHTML = '';
    prices.forEach(p => {
      dropdown.innerHTML += `<option value="${p.name}" data-price="${p.price}">${p.name}</option>`;
    });
    autoFillPrice();
  }

  function autoFillPrice() {
    const dropdown = document.getElementById('serviceDropdown');
    const selected = dropdown.options[dropdown.selectedIndex];
    if (selected) document.getElementById('itemPrice').value = selected.getAttribute('data-price');
  }

  // CENTRALIZED SALES LOGIC (FIREBASE REST API)
  async function addSaleRecord() {
    const date = document.getElementById('entryDate').value;
    const type = document.getElementById('serviceDropdown').value;
    const price = parseFloat(document.getElementById('itemPrice').value);

    if (!date || isNaN(price) || price <= 0) return alert("Lagyan ng tamang halaga!");

    const newSale = { date, type, price, timestamp: Date.now() };
    const dbUrl = getDbUrl();

    if (dbUrl) {
      await fetch(`${dbUrl}sales.json`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newSale)
      });
    } else {
      let sales = JSON.parse(localStorage.getItem('cristyPrintingSales')) || [];
      sales.push({ id: Date.now(), ...newSale });
      localStorage.setItem('cristyPrintingSales', JSON.stringify(sales));
    }

    loadSales();
  }

  async function deleteSaleRecord(keyOrId) {
    if (!confirm("Sigurado ka bang i-vovoid ang benta na ito?")) return;

    const dbUrl = getDbUrl();
    if (dbUrl) {
      await fetch(`${dbUrl}sales/${keyOrId}.json`, { method: 'DELETE' });
    } else {
      let sales = JSON.parse(localStorage.getItem('cristyPrintingSales')) || [];
      sales = sales.filter(item => item.id !== keyOrId);
      localStorage.setItem('cristyPrintingSales', JSON.stringify(sales));
    }

    loadSales();
  }

  async function loadSales() {
    const dbUrl = getDbUrl();
    const tbody = document.getElementById('salesTableBody');
    tbody.innerHTML = '';
    let total = 0;

    if (dbUrl) {
      try {
        const res = await fetch(`${dbUrl}sales.json`);
        const data = await res.json();
        if (data) {
          Object.keys(data).forEach(key => {
            const item = data[key];
            total += item.price;
            tbody.innerHTML += `
              <tr>
                <td>${item.date}</td>
                <td>${item.type}</td>
                <td style="font-weight: bold; color: var(--accent-green);">₱${item.price.toFixed(2)}</td>
                <td style="text-align: center;">
                  <button class="btn-del" onclick="deleteSaleRecord('${key}')">Void</button>
                </td>
              </tr>
            `;
          });
        }
      } catch(e) {
        console.error("Sync error:", e);
      }
    } else {
      const sales = JSON.parse(localStorage.getItem('cristyPrintingSales')) || [];
      sales.forEach(item => {
        total += item.price;
        tbody.innerHTML += `
          <tr>
            <td>${item.date}</td>
            <td>${item.type}</td>
            <td style="font-weight: bold; color: var(--accent-green);">₱${item.price.toFixed(2)}</td>
            <td style="text-align: center;">
              <button class="btn-del" onclick="deleteSaleRecord(${item.id})">Void</button>
            </td>
          </tr>
        `;
      });
    }

    if (tbody.innerHTML === '') {
      tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #cbd5e1; padding: 15px;">Wala pang naitatalang benta.</td></tr>`;
    }

    document.getElementById('totalAmount').innerText = `₱${total.toFixed(2)}`;
  }

  // INITIAL LOAD
  document.addEventListener('DOMContentLoaded', () => {
    loadSavedLogo();
    loadSavedBackground();
    loadPriceManager();
    populateDropdown();
    loadSales();
    
    // Auto refresh sales every 5 seconds para mag-update sa ibang mobile/PC real-time
    setInterval(loadSales, 5000);
  });
</script>

</body>
</html>
