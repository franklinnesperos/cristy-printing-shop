<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cristy Printing Shop - Manager</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.90); /* Transparent kaunti para litaw ang background picture */
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
      --text: #f8fafc;
      --text-sub: #cbd5e1;
      --border: rgba(255, 255, 255, 0.15);
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: var(--bg);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      color: var(--text);
      margin: 0;
      padding: 15px;
      min-height: 100vh;
      transition: background 0.3s ease-in-out;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    .header-card {
      background: linear-gradient(135deg, rgba(30, 58, 138, 0.9) 0%, rgba(59, 130, 246, 0.9) 100%);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 15px;
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .header-card h1 { margin: 0; font-size: 22px; text-transform: uppercase; }
    .header-card p { margin: 4px 0 0; color: #bfdbfe; font-size: 13px; }

    .card {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 15px;
      backdrop-filter: blur(8px); /* Blur effect sa likod ng card para madaling basahin ang text */
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    h2 { font-size: 16px; margin-top: 0; color: #60a5fa; border-bottom: 1px solid var(--border); padding-bottom: 8px; }

    .form-group { margin-bottom: 12px; }

    label {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
      color: var(--text-sub);
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.8);
      color: var(--text);
      box-sizing: border-box;
      font-size: 15px;
      outline: none;
    }

    .btn-save {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .btn-add {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    }

    .btn-del {
      background: #ef4444;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }

    .btn-reset-bg {
      background: #64748b;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      margin-top: 8px;
      width: 100%;
    }

    .price-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .total-card {
      background: var(--card-bg);
      padding: 15px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-left: 5px solid var(--accent-green);
      backdrop-filter: blur(8px);
    }

    .total-title { color: var(--text-sub); font-size: 13px; font-weight: 600; }
    .total-amount { font-size: 22px; font-weight: bold; color: var(--accent-green); }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: rgba(51, 65, 85, 0.9); padding: 10px; font-size: 12px; color: var(--text-sub); }
    td { padding: 10px; border-bottom: 1px solid var(--border); font-size: 14px; }
  </style>
</head>
<body>

<div class="container">
  
  <div class="header-card">
    <h1>🖨️ Cristy Printing Shop</h1>
    <p>Sales Tracker & Price Manager</p>
  </div>

  <!-- SEKSYON 0: Background Picture Customizer -->
  <div class="card">
    <h2>🖼️ Palitan ang Background Picture</h2>
    <div class="form-group">
      <label for="bgUploader">Pumili ng Larawan sa Phone/Computer:</label>
      <input type="file" id="bgUploader" accept="image/*" onchange="changeBackground(event)">
    </div>
    <button class="btn-reset-bg" onclick="removeBackground()">Tanggalin ang Background Picture</button>
  </div>

  <!-- SEKSYON 1: Pag-add & Edit ng Presyo -->
  <div class="card">
    <h2>⚙️ Pamamahala ng Presyo (Price List)</h2>
    <div class="form-group">
      <label for="newServiceName">Pangalan ng Service / Product:</label>
      <input type="text" id="newServiceName" placeholder="ex: Xerox Short, Print Colored A4">
    </div>

    <div class="form-group">
      <label for="newServicePrice">Default na Presyo (₱):</label>
      <input type="number" id="newServicePrice" placeholder="0.00" step="0.01">
    </div>

    <button class="btn-save btn-add" onclick="savePriceItem()">+ Dagdag / I-save sa Listahan</button>

    <h3 style="font-size: 14px; margin-top: 15px; color: var(--text-sub);">Kasalukuyang Presyo:</h3>
    <div id="priceListContainer"></div>
  </div>

  <!-- SEKSYON 2: Encoding ng Araw-araw na Benta -->
  <div class="card">
    <h2>📊 Mag-encode ng Benta</h2>
    <div class="form-group">
      <label for="entryDate">Petsa:</label>
      <input type="date" id="entryDate">
    </div>

    <div class="form-group">
      <label for="serviceDropdown">Pumili ng Service:</label>
      <select id="serviceDropdown" onchange="autoFillPrice()"></select>
    </div>

    <div class="form-group">
      <label for="itemPrice">Halaga ng Benta (₱):</label>
      <input type="number" id="itemPrice" placeholder="0.00" step="0.01">
    </div>

    <button class="btn-save" onclick="addSaleRecord()">+ Record Benta</button>
  </div>

  <!-- Total Benta Display -->
  <div class="total-card">
    <span class="total-title">KABUUMANG BENTA</span>
    <span class="total-amount" id="totalAmount">₱0.00</span>
  </div>

  <!-- Sales Log Table -->
  <div class="card" style="padding: 0; overflow: hidden;">
    <table>
      <thead>
        <tr>
          <th>Petsa</th>
          <th>Service</th>
          <th>Presyo</th>
        </tr>
      </thead>
      <tbody id="salesTableBody"></tbody>
    </table>
  </div>

</div>

<script>
  document.getElementById('entryDate').valueAsDate = new Date();

  // ----- LOGIC PARA SA BACKGROUND IMAGE -----
  function changeBackground(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const imageData = e.target.result;
        document.body.style.backgroundImage = `url('${imageData}')`;
        localStorage.setItem('cristyCustomBg', imageData);
      };
      reader.readAsDataURL(file);
    }
  }

  function removeBackground() {
    document.body.style.backgroundImage = 'none';
    localStorage.removeItem('cristyCustomBg');
    document.getElementById('bgUploader').value = '';
  }

  function loadSavedBackground() {
    const savedBg = localStorage.getItem('cristyCustomBg');
    if (savedBg) {
      document.body.style.backgroundImage = `url('${savedBg}')`;
    }
  }

  // ----- LOGIC PARA SA PRESYO (PRICE LIST) -----
  function getCustomPrices() {
    return JSON.parse(localStorage.getItem('cristyCustomPrices')) || [
      { id: 1, name: '📄 Xerox (Standard)', price: 2.00 },
      { id: 2, name: '🖨️ Print (Document)', price: 5.00 },
      { id: 3, name: '✨ Laminate (A4/Short)', price: 40.00 }
    ];
  }

  function savePriceItem() {
    const name = document.getElementById('newServiceName').value.trim();
    const price = parseFloat(document.getElementById('newServicePrice').value);

    if (!name || isNaN(price) || price < 0) {
      alert("Paki-lagay ang tamang Pangalan at Presyo!");
      return;
    }

    let prices = getCustomPrices();
    prices.push({ id: Date.now(), name, price });
    localStorage.setItem('cristyCustomPrices', JSON.stringify(prices));

    document.getElementById('newServiceName').value = '';
    document.getElementById('newServicePrice').value = '';
    
    loadPriceManager();
    populateDropdown();
  }

  function deletePriceItem(id) {
    let prices = getCustomPrices();
    prices = prices.filter(p => p.id !== id);
    localStorage.setItem('cristyCustomPrices', JSON.stringify(prices));
    loadPriceManager();
    populateDropdown();
  }

  function loadPriceManager() {
    const container = document.getElementById('priceListContainer');
    const prices = getCustomPrices();
    container.innerHTML = '';

    prices.forEach(p => {
      container.innerHTML += `
        <div class="price-item">
          <div><strong>${p.name}</strong> - <span style="color:var(--accent-green)">₱${p.price.toFixed(2)}</span></div>
          <button class="btn-del" onclick="deletePriceItem(${p.id})">Bura</button>
        </div>
      `;
    });
  }

  function populateDropdown() {
    const dropdown = document.getElementById('serviceDropdown');
    const prices = getCustomPrices();
    dropdown.innerHTML = '';

    prices.forEach((p) => {
      dropdown.innerHTML += `<option value="${p.name}" data-price="${p.price}">${p.name}</option>`;
    });

    autoFillPrice();
  }

  function autoFillPrice() {
    const dropdown = document.getElementById('serviceDropdown');
    const selectedOption = dropdown.options[dropdown.selectedIndex];
    if (selectedOption) {
      document.getElementById('itemPrice').value = selectedOption.getAttribute('data-price');
    }
  }

  // ----- LOGIC PARA SA SALES LOG -----
  function getSales() {
    return JSON.parse(localStorage.getItem('cristyPrintingSales')) || [];
  }

  function addSaleRecord() {
    const date = document.getElementById('entryDate').value;
    const type = document.getElementById('serviceDropdown').value;
    const price = parseFloat(document.getElementById('itemPrice').value);

    if (!date || isNaN(price) || price <= 0) {
      alert("Paki-lagay ang tamang halaga!");
      return;
    }

    const sales = getSales();
    sales.push({ date, type, price });
    localStorage.setItem('cristyPrintingSales', JSON.stringify(sales));

    loadSales();
  }

  function loadSales() {
    const sales = getSales();
    const tbody = document.getElementById('salesTableBody');
    tbody.innerHTML = '';
    let total = 0;

    if (sales.length === 0) {
      tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #cbd5e1; padding: 15px;">Wala pang naitatalang benta.</td></tr>`;
      document.getElementById('totalAmount').innerText = '₱0.00';
      return;
    }

    sales.forEach(item => {
      total += item.price;
      tbody.innerHTML += `
        <tr>
          <td>${item.date}</td>
          <td>${item.type}</td>
          <td style="font-weight: bold; color: var(--accent-green);">₱${item.price.toFixed(2)}</td>
        </tr>
      `;
    });

    document.getElementById('totalAmount').innerText = `₱${total.toFixed(2)}`;
  }

  // Initial Load
  document.addEventListener('DOMContentLoaded', () => {
    loadSavedBackground();
    loadPriceManager();
    populateDropdown();
    loadSales();
  });
</script>

</body>
</html>
